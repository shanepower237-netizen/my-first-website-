<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Power Capital</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #071a3d;
            color: white;
        }

        header {
            padding: 25px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
        }

        .hero {
            min-height: 70vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 8%;
        }

        .hero h1 {
            font-size: 60px;
            max-width: 700px;
            margin-bottom: 10px;
        }

        .hero p {
            font-size: 20px;
            color: #c8d2e6;
            max-width: 600px;
        }

        .button {
            display: inline-block;
            background: white;
            color: #071a3d;
            padding: 15px 25px;
            margin-top: 20px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">POWER CAPITAL</div>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>
</header>

<section class="hero">
    <h1>Building the future through smart investment.</h1>

    <p>
        Power Capital is a fictional investment company focused on
        long-term opportunities, innovation and growth.
    </p>

    <a class="button" href="#">Learn More</a>
</section>

</body>
</html>
